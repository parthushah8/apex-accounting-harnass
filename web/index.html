<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>apex-accounting-harness.ai</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="session" class="screen">
    <header class="sess-top">
      <div class="sess-meta">
        <h1>apex-accounting-harness.ai</h1>
        <strong id="sess-name"></strong>
        <span id="sess-live">drawing a task</span>
      </div>
      <button id="again" type="button">Another</button>
    </header>
    <div id="sess-prompt" class="prompt"></div>
    <div id="log" class="log"></div>
    <div id="done" class="done hidden">
      <div class="done-head">
        <h2>Answer</h2>
        <span id="score"></span>
      </div>
      <pre id="answer"></pre>
      <div id="rubric"></div>
    </div>
  </div>
  <div id="composer" class="composer hidden">
    <div class="composer-inner">
      <textarea id="say" rows="1" placeholder="Interrupt the agent — correct it, redirect it, add context…"></textarea>
      <button id="pause" type="button" class="ghost">Pause</button>
      <button id="send" type="button">Send</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
